name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libxkbcommon-dev libwayland-dev libproxy-dev libkrb5-dev libclang-dev gsettings-desktop-schemas libglib2.0-bin krb5-kdc krb5-admin-server krb5-user
      - name: macOS SDK for GSSAPI bindings
        if: runner.os == 'macOS'
        run: |
          echo "LIBGSSAPI_IMPL=apple" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +stable test --locked --all-features
      - name: Isolated Kerberos proxy test
        if: runner.os == 'Linux'
        run: cargo +stable test --locked --all-features --lib kerberos_authenticates_http_and_fdr_tunnels -- --ignored
