[package]
name = "zalivka"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Experimental native Rust DFU restore client for Apple Silicon and T2 Macs"
license = "MIT"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
asn1-rs = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5"
domain = { version = "0.12", default-features = false, features = ["std"] }
fs4 = { version = "1.1", default-features = false }
hex = "0.4"
oxiri = "0.3"
nusb = "0.2.8"
plist = "1.8"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
hpke = { version = "0.13", default-features = false, features = ["alloc", "std", "p256"] }
base64 = "0.23"
hkdf = "0.12"
hmac = "0.12"
httparse = "1.10"
p256 = { version = "0.13", default-features = false, features = ["pem", "std"] }
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "socks-proxy"] }
uuid = "1"
oxitls-rustcrypto-provider = "0.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-tcp", "socket-udp"] }
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.17.2", optional = true }

rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
x509-parser = { version = "0.18", default-features = false }

[target.'cfg(windows)'.dependencies]
cab = "0.6"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_Usb", "Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
